# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "5557b953bcda2461a34b606d9e8cf170"
name = "CardForum Trade-In"
application_url = "https://cardforum.vercel.app"
embedded = true
handle = "cardforum-tradein"

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,write_customers,read_orders,write_orders,read_products,write_products"

[auth]
redirect_urls = [
  "https://cardforum.vercel.app/auth/callback",
  "https://cardforum.vercel.app/auth/shopify/callback",
  "https://cardforum.vercel.app/api/auth/callback"
]

[pos]
embedded = false
